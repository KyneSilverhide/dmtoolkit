services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: criticalfail
      POSTGRES_USER: criticalfail
      POSTGRES_PASSWORD: criticalfail
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  
  dmtoolkit-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://criticalfail:criticalfail@postgres:5432/criticalfail
      JWT_SECRET: changeme_in_production
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - uploads:/app/uploads
  
  dmtoolkit-frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - dmtoolkit-backend
    environment:
      # Lu par docker-entrypoint.sh au démarrage du container (window.BACKEND_URL, injecté
      # dans config.js) — PAS par Vite au build. VITE_BACKEND_URL n'a d'effet qu'au build
      # (ARG dans le Dockerfile, sous build:.args:), inutile ici puisque l'image est buildée
      # une seule fois : sans ce runtime override, le bundle retombe sur frontend/.env.production.
      BACKEND_URL: http://localhost:3000

volumes:
  pgdata:
  uploads:
