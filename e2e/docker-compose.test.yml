# Projet Compose à part : conteneurs, réseau et volumes de test s'appellent dmtoolkit-e2e_*.
# Sans ce nom, la stack de test partageait le projet « dmtoolkit » du dev local, et le
# `down -v` du teardown effaçait les volumes pgdata et uploads du dev.
name: dmtoolkit-e2e

services:
  postgres:
    environment:
      POSTGRES_DB: criticalfail_test

  dmtoolkit-backend:
    environment:
      DATABASE_URL: postgresql://criticalfail:criticalfail@postgres:5432/criticalfail_test
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-e2e
      ADMIN_DEFAULT_USERNAME: admin
      ADMIN_DEFAULT_PASSWORD: ${TEST_ADMIN_PASSWORD:-admin}
      FRONTEND_URL: http://localhost:5173

  dmtoolkit-frontend:
    build:
      args:
        VITE_BACKEND_URL: http://localhost:3000
